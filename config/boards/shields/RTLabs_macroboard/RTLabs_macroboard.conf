# Display
CONFIG_ZMK_DISPLAY=y

# Rotary Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow & SPI Driver
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y

# External Power Control (controls Q3 via P0.24)
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=ya

# Enable OLED Display
CONFIG_ZMK_DISPLAY=y

# Use the standard built-in status screen widgets
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Enable Battery Status Widget
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Enable Layer Status Widget
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# Enable Bluetooth Status Widget (shows active profile / connection state)
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# Enable internal battery monitoring driver
CONFIG_ZMK_BATTERY_REPORTING=y